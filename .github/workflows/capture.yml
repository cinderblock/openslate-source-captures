# The witness: public code, on GitHub's own runner, fetches every source verbatim and seals the
# result. There is no signing key. The workflow's short-lived OIDC identity is the signer, and
# Fulcio's certificate records this repository, commit, workflow file and runner, in a public log.
#
# Every action is pinned to a commit, because a witness must not float on a mutable tag. There are
# no workflow inputs, so a run can't be pointed anywhere a public commit didn't already say.
name: capture

on:
  workflow_dispatch:
  schedule:
    # Daily through the election, then weekly.
    - cron: "0 10 30,31 10 *"
    - cron: "0 10 1-5 11 *"
    - cron: "0 10 * * 1"

concurrency:
  group: capture
  cancel-in-progress: false

permissions: {}

jobs:
  capture:
    # Must stay GitHub-hosted: verifiers reject any other `runner_environment`.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Lets the job ask GitHub for an OIDC token, which is what gets certified.
      id-token: write
      # Stores the attestation with GitHub as well as in the public log.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tool, not past captures.
          sparse-checkout: |
            /src
            /package.json
            /bun.lock
            /tsconfig.json
            /discovered.json
            /withheld-hosts.json
            /render-hosts.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cinderblock/openslate-public-endorsements
          path: endorsements
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      # Everything that touches the captured bytes runs here, in this one job, which holds no
      # credential that can write anywhere.
      - name: List sources
        run: bun src/sources.ts endorsements
      - name: Capture
        run: bun src/run.ts out
      - name: Timestamp
        run: bun src/seal.ts out

      # One attestation covers the whole run: the manifest names every other byte by hash.
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/manifest.json
      - run: |
          cp "${{ steps.attest.outputs.bundle-path }}" out/manifest.sigstore.json
          cp sources.json out/sources.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture
          path: out
          retention-days: 7
          compression-level: 0

  publish:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # One issue lists sources that keep failing, for a developer to look into.
      issues: write
    steps:
      # The branch as it is now, not the commit this run started on. Another run, the archive job or
      # a home fill-in may have published since, and provenance is rebuilt from everything published.
      # The captured bytes came from the capture job, which this can't change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cinderblock/openslate-public-endorsements
          path: endorsements
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: capture
          path: artifact

      # The key goes to an agent, never to the runner's disk, and only this job can read it.
      - name: Open the private store
        env:
          DEPLOY_KEY: ${{ secrets.PRIVATE_STORE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "$DEPLOY_KEY"
          mkdir -p ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          git clone --depth 1 git@github.com:cinderblock/openslate-source-captures-private.git private

      - name: Place the run
        run: |
          cp artifact/sources.json sources.json
          bun src/publish.ts artifact --private private

      # Offline, from what's now in the repo. A failure here must not lose the run.
      - name: Rebuild provenance
        continue-on-error: true
        run: bun src/build-provenance.ts endorsements --private private --large large

      - name: List sources that keep failing
        continue-on-error: true
        run: bun src/failing.ts failing-sources.md

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(ls -t runs | head -1)
          git config --global user.name "openslate-source-capture[bot]"
          git config --global user.email "noreply@openslate.us"
          if compgen -G "large/*" > /dev/null; then
            gh release view large-blobs > /dev/null 2>&1 || gh release create large-blobs \
              --title "Large blobs" --notes "Captured files over 5 MB, each named by its SHA-256."
            # Named by hash, so an asset already there is already right.
            have=$(gh release view large-blobs --json assets --jq '.assets[].name')
            for file in large/*; do
              grep -qx "$(basename "$file")" <<< "$have" || gh release upload large-blobs "$file"
            done
          fi
          git -C private add blobs
          git -C private diff --cached --quiet || git -C private commit -q -m "capture $id"
          # Blobs are named by their hash, so two runs' commits never conflict.
          for try in 1 2 3; do
            git -C private push origin HEAD && break
            [ "$try" = 3 ] && exit 1
            git -C private pull --rebase --autostash -q
          done
          git add runs blobs sources.json provenance
          if [ -f failing-sources.md ]; then git add failing-sources.md; fi
          git commit -q -m "capture $id"
          # Someone pushed meanwhile. This run's files are new, so they never conflict; provenance and
          # the failing list are derived, so take this run's copy and rebuild them over both.
          for try in 1 2 3; do
            git push origin HEAD && break
            [ "$try" = 3 ] && exit 1
            git pull --rebase --autostash -q -X theirs
            bun src/build-provenance.ts endorsements --private private --large large || true
            bun src/failing.ts failing-sources.md || true
            git add provenance
            if [ -f failing-sources.md ]; then git add failing-sources.md; fi
            git diff --cached --quiet || git commit -q --amend --no-edit
          done

      # Opened when something fails repeatedly, kept current, closed once nothing does. Editing the
      # body notifies nobody; opening it notifies the repository's watchers.
      - name: Refer repeated failures to a developer
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f failing-sources.md ] || exit 0
          title="Sources that keep failing"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if grep -q "^Nothing is failing repeatedly" failing-sources.md; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Nothing is failing repeatedly now."
            fi
            exit 0
          fi
          # An issue body holds 65,536 characters.
          head -c 60000 failing-sources.md > body.md
          link="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/${{ github.event.repository.default_branch }}/failing-sources.md"
          printf '\n\nThe whole list, kept with the runs: [failing-sources.md](%s)\n' "$link" >> body.md
          if [ -n "$number" ]; then gh issue edit "$number" --body-file body.md
          else gh issue create --title "$title" --body-file body.md
          fi
