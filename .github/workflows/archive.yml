# Best effort: ask the Internet Archive for snapshots of cited pages, and check the ones it has.
# Nothing depends on this. It only adds the "independently archived" claim where the text agrees.
name: archive

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Pages to ask for now, comma separated, instead of the queue. Blank runs the queue."
        required: false
  schedule:
    # Hourly through the election, then weekly.
    - cron: "30 * 30,31 10 *"
    - cron: "30 * 1-5 11 *"
    - cron: "30 12 * * 2"

concurrency:
  group: archive
  cancel-in-progress: false

permissions: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      # The branch tip: a queued run's own commit predates what the run before it committed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cinderblock/openslate-public-endorsements
          path: endorsements
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # At most 4 a minute, and fewer when capture sessions are busy. Without these secrets this falls back to anonymous requests.
      - run: bun src/archive.ts save --limit 120 --minutes 30 ${ONLY:+--only "$ONLY"}
        timeout-minutes: 36
        continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
          ARCHIVE_ORG_ACCESS_KEY: ${{ secrets.ARCHIVE_ORG_ACCESS_KEY }}
          ARCHIVE_ORG_SECRET_KEY: ${{ secrets.ARCHIVE_ORG_SECRET_KEY }}
      - run: bun src/archive.ts lookup --limit 200
        timeout-minutes: 12
        continue-on-error: true
      - run: bun src/archive.ts compare endorsements --limit 200
        timeout-minutes: 15
        continue-on-error: true
      - name: Commit
        run: |
          git config --global user.name "openslate-source-capture[bot]"
          git config --global user.email "noreply@openslate.us"
          git add archived.json
          git diff --cached --quiet && exit 0
          git commit -q -m "archive: update snapshots"
          # This run's results win: it holds job IDs that can't be fetched again.
          git pull --rebase --autostash -X theirs
          jq empty archived.json
          git push origin HEAD
